worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $uri $cache_policy {
        default "public, max-age=3600";
        ~^/assets/ "public, max-age=31536000, immutable";
        /index.html "no-cache";
        / "no-cache";
        /healthz "no-store";
    }

    server {
        listen 8080;
        server_name asteroid.moone.dev;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        add_header Cache-Control $cache_policy always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        # Release archives can share HTML size and mtime. Always send the current
        # entry point instead of validating an older build with the same ETag.
        location = / {
            etag off;
            if_modified_since off;
            try_files /index.html =404;
        }
        location = /index.html {
            etag off;
            if_modified_since off;
        }
        location ~ /\. { deny all; }
        location / { try_files $uri $uri/ =404; }
    }
}
